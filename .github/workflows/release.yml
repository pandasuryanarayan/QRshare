name: Build signed release APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble optimised, signed release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "${KEYSTORE_BASE64:-}" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "${KEYSTORE_PASSWORD:-}" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "${KEY_ALIAS:-}" ] && missing="$missing KEY_ALIAS"
          [ -z "${KEY_PASSWORD:-}" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "::error::Add them under Settings > Secrets and variables > Actions. See README, 'Signed release builds'. A build signed with a different key cannot install over an existing one."
            exit 1
          fi
          echo "All four signing secrets are present."

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          KS="$RUNNER_TEMP/signing/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "SIGNING_MODE=repository secret" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$KS" -storepass "$STOREPASS" 2>/dev/null \
            | grep -E "Alias name|SHA256:" | head -4 || true

      - name: Unit tests
        run: |
          if ./gradlew --no-daemon --stacktrace test; then
            echo "Unit tests passed."
          else
            echo "::group::Available test tasks"
            ./gradlew --no-daemon :app:tasks --all 2>/dev/null | grep -i test || true
            echo "::endgroup::"
            echo "::error::Unit tests failed."
            exit 1
          fi

      - name: Assemble release (R8 full mode, resource shrinking, signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REQUIRE_SIGNING: 'true'
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          {
            echo "### QRshare release build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| APK size | $(du -h "$APK" | cut -f1) |"
            echo "| Version | $(grep -m1 'versionName' app/build.gradle.kts | cut -d'"' -f2) |"
            echo "| R8 full mode | enabled |"
            echo "| Resource shrinking | enabled |"
            echo "| Signing key | ${SIGNING_MODE:-unknown} |"
            echo "| Signature | $( "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -m1 'SHA-256' | sed 's/^ *//' ) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: qrshare-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: qrshare-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
